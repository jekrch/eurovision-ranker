name: Run Tests

on:
  push:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Typecheck
      run: bun run typecheck

    - name: Lint
      # warnings are allowed for now (import/order + exhaustive-deps); fail only on errors.
      run: bun run lint

    - name: Run tests with coverage
      # Coverage thresholds in vitest.config.ts fail the build on regression.
      run: bun run test:coverage