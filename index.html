  <!-- gh-pages SPA decoder: pairs with public/404.html to restore deep-link URLs
       before the React bundle reads window.location. -->
  <script>
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>

  <!-- Stamp the active theme on <html> before the first paint. The theme is
       carried in the `t` query param, so it is already known here; without this
       the page paints the :root palette and then repaints once React mounts and
       applies the real theme. THEME_CODES/DEFAULT_CODE mirror THEME_OPTIONS in
       src/components/modals/config/DisplayTab.tsx. -->
  <script>
    (function () {
      var THEME_CODES = ['d', 'ab', 'm', 'o', 's', 'f', 'p', 'pr', 'r'];
      var DEFAULT_CODE = 's';
      var t = new URLSearchParams(window.location.search).get('t');
      // 'ab' (Auroral) layers over the default palette instead of defining one
      var known = t && t !== 'ab' && THEME_CODES.indexOf(t) !== -1;
      document.documentElement.setAttribute('data-theme', known ? t : DEFAULT_CODE);
    })();
  </script>
